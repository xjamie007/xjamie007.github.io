# Bauen a verëffentlechen.
#
# Leeft bei all Push op `main`. Wat d'Préifung net besteet, geet net live —
# `npm run verify` ass d'Gerippe vun der Iwwergab-Checklëscht a leeft hei mat.
#
# GitHub Pages muss an de Repository-Astellungen op „GitHub Actions" stoen.
# Fir en anere Host (Netlify, Cloudflare Pages, eegene Server) bleift de
# `build`-Job identesch — nëmmen den `deploy`-Job gëtt ersat.
name: Bauen a verëffentlechen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typen a Sproochen: eng feelend Iwwersetzung brécht de Build mat Absicht.
      - name: Typen préiwen
        run: npx astro check

      - name: Bauen
        env:
          # Umzug auf kasel.lu: Repository-Variable SITE_URL setzen, sonst
          # bleibt es bei der GitHub-Pages-Adresse aus astro.config.mjs.
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_INQUIRY_ENDPOINT: ${{ secrets.PUBLIC_INQUIRY_ENDPOINT }}
        run: npx astro build

      # Farben, Kontrast, hreflang, Alt-Texte, tote Links, JS-Budget, Geheimnisse.
      # Ohne hinterlegten Endpunkt läuft die Prüfung im Vorschaumodus: dann ist
      # das fehlende Postfach ein Hinweis statt eines Fehlers. Alles andere
      # bleibt ein hartes Tor — was hier durchfällt, geht nicht live.
      - name: Übergabe-Prüfung
        run: |
          if [ -n "${{ secrets.PUBLIC_INQUIRY_ENDPOINT }}" ]; then
            node scripts/verify.mjs
          else
            echo "::warning::PUBLIC_INQUIRY_ENDPOINT ist nicht gesetzt — Vorschau-Deploy, das Formular schickt noch nichts."
            node scripts/verify.mjs --preview
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
